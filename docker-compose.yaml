# Docker keeps container logs until the container is removed; cap them by size
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  nodeserver:
    restart: always
    logging: *logging
    build:
      context: ./
    # The app's server calls ldb-api (src/routes/api/json/+server.ts) through the port it publishes on this host;
    # /status also checks ldb-api's /health next to it (src/lib/server/status.ts)
    environment:
      - LDB_API_URL=http://host.docker.internal:84/json
    # Short links: one JSON file per list, kept across deploys; in the server's daily backup
    # (/usr/local/sbin/server-backup: /var/lib/docker/volumes/urlhub_data)
    volumes:
      - data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '98:3000'

volumes:
  data:
