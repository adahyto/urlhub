# Docker keeps container logs until the container is removed; cap them by size
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nodeserver:
    restart: always
    logging: *logging
    build:
      context: ./
    # The app's server calls ldb-api (src/routes/api/json/+server.ts) through the port it publishes on this host
    environment:
      - LDB_API_URL=http://host.docker.internal:84/json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "98:3000"
